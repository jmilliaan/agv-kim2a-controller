<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>AGV Manual Remote</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #d4d0c8;
    color: #000;
    font-family: 'Inter', system-ui, sans-serif;
    font-size: 20px;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
  }

  /* ── Header ── */
  #header {
    display: flex;
    align-items: center;
    gap: 18px;
    background: #000080;
    color: #fff;
    padding: 8px 16px;
    font-weight: bold;
    font-size: 20px;
    letter-spacing: 2px;
    flex-shrink: 0;
  }
  #header a {
    color: #adf;
    text-decoration: none;
    font-size: 18px;
    letter-spacing: 0;
  }
  #header .title { flex: 1; }

  .mode-badge {
    padding: 3px 18px;
    font-size: 18px;
    font-weight: bold;
    letter-spacing: 1px;
    border-top:    3px solid #808080;
    border-left:   3px solid #808080;
    border-right:  3px solid #fff;
    border-bottom: 3px solid #fff;
    background: #c0c0c0;
    color: #000;
  }
  .mode-manual  { background: #0000c0; color: #fff; }
  .mode-armed   { background: #c0c000; color: #000; }
  .mode-running { background: #00a000; color: #fff; }
  .mode-emergency { background: #c00000; color: #fff; }

  /* ── Status bar ── */
  #status-bar {
    padding: 6px 16px;
    background: #c0c0c0;
    border-bottom: 3px solid #808080;
    font-size: 18px;
    flex-shrink: 0;
  }
  #status-bar.ok   { color: #006000; }
  #status-bar.warn { color: #c00000; font-weight: bold; }

  /* ── Sensor strip ── */
  #sensor-strip {
    padding: 4px 16px;
    background: #c0c0c0;
    border-bottom: 3px solid #808080;
    font-size: 18px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 20px;
  }
  .ss-label {
    font-weight: bold; letter-spacing: 0.5px; color: #404040;
    text-transform: uppercase; font-size: 16px;
  }
  #ss-pos {
    font-size: 28px; font-weight: bold; color: #000080;
    font-family: 'Courier New', Courier, monospace;
    background: #fff; padding: 2px 12px; min-width: 96px;
    text-align: right;
    border-top:    3px solid #808080;
    border-left:   3px solid #808080;
    border-right:  3px solid #fff;
    border-bottom: 3px solid #fff;
  }
  .ss-unit { font-size: 16px; color: #606060; }
  #ss-tape {
    font-size: 16px; font-weight: bold; letter-spacing: 0.5px;
    padding: 2px 10px;
    background: #888; color: #fff;
    border-top:    3px solid #fff;
    border-left:   3px solid #fff;
    border-right:  3px solid #404040;
    border-bottom: 3px solid #404040;
  }
  #ss-tape.detected {
    background: #006000; color: #fff;
    border-top:    3px solid #80ff80;
    border-left:   3px solid #80ff80;
    border-right:  3px solid #003000;
    border-bottom: 3px solid #003000;
  }

  /* ── Main area ── */
  #main {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 12px;
    min-height: 0;
    overflow: hidden;
  }

  /* ── Compass grid ── */
  #compass {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    gap: 12px;
    width: min(90vw, 540px);
    height: min(90vw, 540px);
    max-width: 100%;
    max-height: 100%;
  }

  .btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    background: #c0c0c0;
    border-top:    5px solid #fff;
    border-left:   5px solid #fff;
    border-right:  5px solid #404040;
    border-bottom: 5px solid #404040;
    cursor: pointer;
    font-family: 'Inter', system-ui, sans-serif;
    font-size: 16px;
    font-weight: bold;
    letter-spacing: 0.5px;
    text-align: center;
    line-height: 1.2;
    touch-action: none;
    -webkit-tap-highlight-color: transparent;
    transition: background 0.05s;
  }

  .btn .arrow {
    font-size: 32px;
    line-height: 1;
  }

  .btn:active,
  .btn.pressed {
    background: #a0a0a0;
    border-top:    5px solid #404040;
    border-left:   5px solid #404040;
    border-right:  5px solid #fff;
    border-bottom: 5px solid #fff;
  }

  .btn.diag { background: #b8b8b0; }
  .btn.diag:active, .btn.diag.pressed { background: #909088; }

  .center-cell {
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 30px;
    opacity: 0.3;
  }

  /* Disabled state when not in manual */
  body.not-manual #compass { opacity: 0.35; pointer-events: none; }
  body.not-manual #status-bar { animation: blink 1s step-start infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  /* ── Active command display ── */
  #active-cmd {
    text-align: center;
    font-size: 18px;
    font-weight: bold;
    letter-spacing: 1px;
    padding: 6px 16px;
    background: #c0c0c0;
    border-top: 3px solid #808080;
    flex-shrink: 0;
    height: 40px;
  }

  /* ── Input debug panel ── */
  #dbg-panel {
    margin-top: 14px;
    background: #c0c0c0;
    border-top:    3px solid #fff;
    border-left:   3px solid #fff;
    border-right:  3px solid #808080;
    border-bottom: 3px solid #808080;
    padding: 10px 12px;
  }
  #dbg-panel.off { opacity: 0.5; }
  #dbg-header {
    display: flex; align-items: center; gap: 12px;
    font-weight: bold; font-size: 14px; letter-spacing: 2px;
    margin-bottom: 10px;
  }
  #dbg-led {
    width: 14px; height: 14px; border-radius: 50%;
    background: #404040;
    border-top: 2px solid #000; border-left: 2px solid #000;
    border-right: 2px solid #808080; border-bottom: 2px solid #808080;
  }
  #dbg-led.on { background: #40ff40; box-shadow: 0 0 8px #40ff40; }
  #dbg-row {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  }
  .dbg-btn {
    padding: 10px 18px;
    font-family: 'Inter', system-ui, sans-serif;
    font-size: 15px; font-weight: bold; letter-spacing: 1px;
    cursor: pointer; background: #c0c0c0; color: #000;
    border-top:    3px solid #fff;
    border-left:   3px solid #fff;
    border-right:  3px solid #808080;
    border-bottom: 3px solid #808080;
  }
  .dbg-btn:active {
    border-top:    3px solid #808080;
    border-left:   3px solid #808080;
    border-right:  3px solid #fff;
    border-bottom: 3px solid #fff;
  }
  .dbg-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  #btn-dbg-start { color: #006000; }
  #btn-dbg-reset { color: #800000; }
  #dbg-switch {
    display: flex; align-items: center; gap: 8px;
    margin-left: auto;
    font-size: 13px; font-weight: bold; letter-spacing: 1px;
  }
  #dbg-switch .sw-label.act { color: #000080; }
  #dbg-switch .sw-label     { color: #808080; }

  /* ── Pusher panel ── */
  #pusher-panel {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 8px 16px;
    background: #c0c0c0;
    border-top: 3px solid #808080;
    flex-shrink: 0;
  }
  .pusher-btn {
    padding: 8px 28px;
    font-family: 'Inter', system-ui, sans-serif;
    font-size: 16px;
    font-weight: bold;
    letter-spacing: 1px;
    cursor: pointer;
  }
  #btn-pusher-up {
    background: #004080; color: #fff;
    border-top: 3px solid #0070d0; border-left: 3px solid #0070d0;
    border-right: 3px solid #002040; border-bottom: 3px solid #002040;
  }
  #btn-pusher-up:active {
    border-top: 3px solid #002040; border-left: 3px solid #002040;
    border-right: 3px solid #0070d0; border-bottom: 3px solid #0070d0;
  }
  #btn-pusher-down {
    background: #804000; color: #fff;
    border-top: 3px solid #c06000; border-left: 3px solid #c06000;
    border-right: 3px solid #402000; border-bottom: 3px solid #402000;
  }
  #btn-pusher-down:active {
    border-top: 3px solid #402000; border-left: 3px solid #402000;
    border-right: 3px solid #c06000; border-bottom: 3px solid #c06000;
  }
  #pusher-status {
    font-size: 15px; font-weight: bold; letter-spacing: 0.5px;
    flex: 1; text-align: right;
  }
  body.not-manual #pusher-panel { opacity: 0.35; pointer-events: none; }

  /* ── Bottom nav bar ── */
  #nav-bar {
    display: flex;
    background: #c0c0c0;
    border-top: 3px solid #fff;
    padding: 6px 12px;
    gap: 6px;
    flex-shrink: 0;
  }
  .nav-btn {
    flex: 1;
    padding: 8px 0;
    font-family: 'Inter', system-ui, sans-serif;
    font-size: 16px;
    font-weight: bold;
    letter-spacing: 1px;
    cursor: pointer;
    text-transform: uppercase;
    background: #c0c0c0;
    color: #000;
    border-top:    3px solid #fff;
    border-left:   3px solid #fff;
    border-right:  3px solid #808080;
    border-bottom: 3px solid #808080;
  }
  .nav-btn.active {
    background: #000080;
    color: #fff;
    border-top:    3px solid #404040;
    border-left:   3px solid #404040;
    border-right:  3px solid #c0c0c0;
    border-bottom: 3px solid #c0c0c0;
  }
  .nav-btn:active:not(.active) {
    border-top:    3px solid #808080;
    border-left:   3px solid #808080;
    border-right:  3px solid #fff;
    border-bottom: 3px solid #fff;
  }

  /* ── Kiosk / flip mode (?flip=1) ── */
  html.flipped {
    transform: rotate(180deg);
    transform-origin: 50% 50%;
  }
</style>
<script>
  if (new URLSearchParams(location.search).get('flip') === '1') {
    document.documentElement.classList.add('flipped');
    document.querySelectorAll('[onclick]').forEach(function(el) {
      var m = el.getAttribute('onclick').match(/location\.href='([^']+)'/);
      if (m) el.setAttribute('onclick', "location.href='" + m[1] + "?flip=1'");
    });
  }
</script>
</head>
<body class="not-manual">

<div id="header">
  <span class="title">AGV MANUAL REMOTE</span>
  <span id="mode-badge" class="mode-badge">---</span>
</div>

<div id="status-bar" class="warn">Connecting...</div>

<div id="sensor-strip">
  <span class="ss-label">Sensor pos:</span>
  <span id="ss-pos">&#8212;</span>
  <span class="ss-unit">mm</span>
  <span id="ss-tape">NO TAPE</span>
</div>

<div id="main">
  <div id="compass">
    <!-- Row 1 -->
    <button class="btn diag" data-cmd="fwd_left"  id="btn-fwd-left">
      <span class="arrow">&#8598;</span>FWD-L
    </button>
    <button class="btn" data-cmd="forward" id="btn-fwd">
      <span class="arrow">&#8593;</span>FORWARD
    </button>
    <button class="btn diag" data-cmd="fwd_right" id="btn-fwd-right">
      <span class="arrow">&#8599;</span>FWD-R
    </button>

    <!-- Row 2 -->
    <button class="btn" data-cmd="left" id="btn-left">
      <span class="arrow">&#8592;</span>LEFT
    </button>
    <div class="center-cell">&#9679;</div>
    <button class="btn" data-cmd="right" id="btn-right">
      <span class="arrow">&#8594;</span>RIGHT
    </button>

    <!-- Row 3 -->
    <button class="btn diag" data-cmd="rvs_left" id="btn-rvs-left">
      <span class="arrow">&#8601;</span>RVS-L
    </button>
    <button class="btn" data-cmd="reverse" id="btn-rvs">
      <span class="arrow">&#8595;</span>REVERSE
    </button>
    <button class="btn diag" data-cmd="rvs_right" id="btn-rvs-right">
      <span class="arrow">&#8600;</span>RVS-R
    </button>
  </div>
</div>

<div id="active-cmd"></div>

<!-- Pusher panel -->
<div id="pusher-panel">
  <button id="btn-pusher-up"   class="pusher-btn">&#9650; PUSHER UP</button>
  <button id="btn-pusher-down" class="pusher-btn">&#9660; PUSHER DOWN</button>
  <span id="pusher-status"></span>
</div>

<!-- Input debug panel (virtual START / RESET / MODE switch) -->
<div id="dbg-panel" class="off">
  <div id="dbg-header">
    <span id="dbg-led"></span>
    <span>INPUT DEBUG MODE: <span id="dbg-state">OFF</span></span>
    <span style="font-weight:normal;font-size:12px;color:#404040;letter-spacing:0;">
      (enable on PARAMETERS page)
    </span>
  </div>
  <div id="dbg-row">
    <button id="btn-dbg-start" class="dbg-btn" disabled>&#9658; START</button>
    <button id="btn-dbg-reset" class="dbg-btn" disabled>&#11036; RESET</button>
    <div id="dbg-switch">
      <span id="sw-lbl-auto"   class="sw-label">AUTO</span>
      <button id="btn-dbg-switch" class="dbg-btn" disabled style="min-width:80px;">--</button>
      <span id="sw-lbl-manual" class="sw-label">MANUAL</span>
    </div>
  </div>
</div>

<!-- Bottom nav bar -->
<div id="nav-bar">
  <button class="nav-btn" onclick="location.href='/'">HOME</button>
  <button class="nav-btn active">MANUAL</button>
  <button class="nav-btn" onclick="location.href='/io'">IO MONITOR</button>
  <button class="nav-btn" onclick="location.href='/params'">PARAMETERS</button>
  <button class="nav-btn" onclick="location.href='/mappings'">MAPPINGS</button>
  <button class="nav-btn" onclick="location.href='/errors'">ERRORS</button>
</div>

<script>
  const statusBar  = document.getElementById('status-bar');
  const modeBadge  = document.getElementById('mode-badge');
  const activeCmd  = document.getElementById('active-cmd');
  const body       = document.body;
  let   activeBtn  = null;
  let   lastMode   = null;
  let   keepalive  = null;   // interval that re-sends the active command every 200 ms

  // ── Send command to backend ───────────────────────────────────────────────
  function sendCommand(cmd) {
    fetch('/api/manual/command', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ command: cmd }),
      keepalive: true
    }).catch(() => {});
  }

  // ── Button press / release ────────────────────────────────────────────────
  function onPress(btn) {
    if (activeBtn && activeBtn !== btn) onRelease(activeBtn);
    activeBtn = btn;
    btn.classList.add('pressed');
    const cmd = btn.dataset.cmd;
    activeCmd.textContent = '> ' + cmd.toUpperCase().replace(/_/g, ' ');
    sendCommand(cmd);
    // Keepalive: re-send every 200 ms so the server timeout never fires while held
    clearInterval(keepalive);
    keepalive = setInterval(() => sendCommand(cmd), 200);
  }

  function onRelease(btn) {
    if (!btn) return;
    btn.classList.remove('pressed');
    activeBtn = null;
    activeCmd.textContent = '';
    clearInterval(keepalive);
    keepalive = null;
    // Send stop immediately, then twice more to survive a laggy network
    sendCommand(null);
    setTimeout(() => sendCommand(null), 150);
    setTimeout(() => sendCommand(null), 400);
  }

  // ── Attach touch/mouse events to all buttons ──────────────────────────────
  document.querySelectorAll('.btn[data-cmd]').forEach(btn => {
    btn.addEventListener('mousedown',  e => { e.preventDefault(); onPress(btn); });
    btn.addEventListener('mouseup',    e => onRelease(btn));
    btn.addEventListener('mouseleave', e => { if (activeBtn === btn) onRelease(btn); });

    btn.addEventListener('touchstart',  e => { e.preventDefault(); onPress(btn); }, { passive: false });
    btn.addEventListener('touchend',    e => { e.preventDefault(); onRelease(btn); }, { passive: false });
    btn.addEventListener('touchcancel', e => { e.preventDefault(); onRelease(btn); }, { passive: false });
  });

  // ── Keyboard (arrow keys) ─────────────────────────────────────────────────
  const ARROW_KEYS = new Set(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight']);
  const keysDown   = new Set();

  function cmdFromKeys() {
    const u = keysDown.has('ArrowUp'),   d = keysDown.has('ArrowDown');
    const l = keysDown.has('ArrowLeft'), r = keysDown.has('ArrowRight');
    if (u && l) return 'fwd_left';
    if (u && r) return 'fwd_right';
    if (d && l) return 'rvs_left';
    if (d && r) return 'rvs_right';
    if (u)  return 'forward';
    if (d)  return 'reverse';
    if (l)  return 'left';
    if (r)  return 'right';
    return null;
  }

  document.addEventListener('keydown', e => {
    if (!ARROW_KEYS.has(e.key)) return;
    e.preventDefault();
    keysDown.add(e.key);
    const cmd = cmdFromKeys();
    const btn = cmd ? document.querySelector('[data-cmd="' + cmd + '"]') : null;
    if (btn && btn !== activeBtn) onPress(btn);
  });

  document.addEventListener('keyup', e => {
    if (!ARROW_KEYS.has(e.key)) return;
    keysDown.delete(e.key);
    const cmd = cmdFromKeys();
    if (!cmd) {
      if (activeBtn) onRelease(activeBtn);
    } else {
      const btn = document.querySelector('[data-cmd="' + cmd + '"]');
      if (btn && btn !== activeBtn) onPress(btn);
    }
  });

  // Safety: lose focus or hide tab -> stop
  window.addEventListener('blur', () => { keysDown.clear(); if (activeBtn) onRelease(activeBtn); });
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { keysDown.clear(); if (activeBtn) onRelease(activeBtn); }
  });

  // ── State polling ─────────────────────────────────────────────────────────
  function applyMode(mode) {
    if (mode === lastMode) return;
    lastMode = mode;

    modeBadge.className = 'mode-badge';
    modeBadge.textContent = mode ? mode.toUpperCase() : '---';
    if (mode === 'manual')         modeBadge.classList.add('mode-manual');
    else if (mode === 'armed')     modeBadge.classList.add('mode-armed');
    else if (mode === 'running')   modeBadge.classList.add('mode-running');
    else if (mode === 'emergency') modeBadge.classList.add('mode-emergency');

    if (mode === 'manual') {
      body.classList.remove('not-manual');
      statusBar.className = 'ok';
      statusBar.textContent = 'MANUAL MODE -- hold a button or arrow key to move.';
    } else {
      body.classList.add('not-manual');
      keysDown.clear();
      if (activeBtn) onRelease(activeBtn);
      statusBar.className = 'warn';
      statusBar.textContent = mode
        ? 'Switch AGV to MANUAL mode to use this remote. Current: ' + mode.toUpperCase()
        : 'AGV not ready.';
    }
  }

  async function poll() {
    try {
      const r = await fetch('/api/state');
      if (!r.ok) throw new Error(r.status);
      const d = await r.json();
      applyMode(d.agv.mode);

      const sen    = d.sensor || {};
      const posEl  = document.getElementById('ss-pos');
      const tapeEl = document.getElementById('ss-tape');
      posEl.textContent = (sen.left_mm !== null && sen.left_mm !== undefined)
        ? sen.left_mm : '--';
      if (sen.tape_detected) {
        tapeEl.textContent = 'TAPE OK';
        tapeEl.className = 'detected';
      } else {
        tapeEl.textContent = 'NO TAPE';
        tapeEl.className = '';
      }

      // Input debug panel — LED + button enable state + switch label.
      const dbgOn = !!d.agv.input_debug_mode_enabled;
      const swMan = !!d.agv.virtual_switch_manual;
      document.getElementById('dbg-led').className   = dbgOn ? 'on' : '';
      document.getElementById('dbg-state').textContent = dbgOn ? 'ON' : 'OFF';
      document.getElementById('dbg-panel').className   = dbgOn ? '' : 'off';
      ['btn-dbg-start','btn-dbg-reset','btn-dbg-switch'].forEach(id => {
        document.getElementById(id).disabled = !dbgOn;
      });
      const swBtn = document.getElementById('btn-dbg-switch');
      swBtn.textContent = swMan ? 'MANUAL' : 'AUTO';
      swBtn.style.background = swMan ? '#0000c0' : '#c0c0c0';
      swBtn.style.color      = swMan ? '#fff'    : '#000';
      document.getElementById('sw-lbl-manual').className = swMan ? 'sw-label act' : 'sw-label';
      document.getElementById('sw-lbl-auto').className   = swMan ? 'sw-label' : 'sw-label act';
    } catch(e) {
      statusBar.className = 'warn';
      statusBar.textContent = 'Connection lost -- retrying...';
    }
  }

  // ── Input debug virtual buttons ─────────────────────────────────────────
  function dbgPress(name) {
    fetch('/api/debug/button', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name }),
      keepalive: true
    }).catch(() => {});
  }
  function dbgToggleSwitch() {
    const cur = document.getElementById('btn-dbg-switch').textContent.trim();
    const nextManual = (cur !== 'MANUAL');   // toggle
    fetch('/api/debug/switch', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ manual: nextManual }),
      keepalive: true
    }).catch(() => {});
  }
  document.getElementById('btn-dbg-start').addEventListener('click', () => dbgPress('start'));
  document.getElementById('btn-dbg-reset').addEventListener('click', () => dbgPress('reset'));
  document.getElementById('btn-dbg-switch').addEventListener('click', dbgToggleSwitch);

  poll();
  setInterval(poll, 500);

  // ── Pusher buttons (hold to energise, release to de-energise) ───────────
  function pusherSend(action) {
    fetch('/api/manual/pusher', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action }),
      keepalive: true
    }).catch(() => {});
  }

  function pusherPress(action) {
    const st = document.getElementById('pusher-status');
    st.textContent = action === 'up' ? '▲ PUSHER UP' : '▼ PUSHER DOWN';
    st.style.color  = action === 'up' ? '#004080' : '#804000';
    pusherSend(action);
  }

  function pusherRelease() {
    const st = document.getElementById('pusher-status');
    st.textContent = '';
    pusherSend('clear');
  }

  ['btn-pusher-up', 'btn-pusher-down'].forEach(id => {
    const btn    = document.getElementById(id);
    const action = id === 'btn-pusher-up' ? 'up' : 'down';

    btn.addEventListener('mousedown',   e => { e.preventDefault(); pusherPress(action); });
    btn.addEventListener('mouseup',     ()  => pusherRelease());
    btn.addEventListener('mouseleave',  ()  => pusherRelease());

    btn.addEventListener('touchstart',  e => { e.preventDefault(); pusherPress(action); }, { passive: false });
    btn.addEventListener('touchend',    e => { e.preventDefault(); pusherRelease(); },     { passive: false });
    btn.addEventListener('touchcancel', e => { e.preventDefault(); pusherRelease(); },     { passive: false });
  });

  // Safety: lose focus or tab hidden -> release pusher
  window.addEventListener('blur', () => pusherRelease());
  document.addEventListener('visibilitychange', () => { if (document.hidden) pusherRelease(); });
</script>
</body>
</html>
