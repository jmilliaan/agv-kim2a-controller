<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>AGV Manual Remote</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #d4d0c8;
    color: #000;
    font-family: Consolas, 'Courier New', Courier, monospace;
    font-size: 16px;
    height: calc(100dvh - 55px);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
  }

  /* ── Nav bar ── */
  #nav-bar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    height: 55px;
    background: #1a1a6e;
    display: flex;
    z-index: 200;
    border-top: 2px solid #4040a0;
  }
  .nav-btn {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #a0a0e0;
    font-family: Consolas, 'Courier New', Courier, monospace;
    font-size: 14px;
    font-weight: bold;
    letter-spacing: 1px;
    text-decoration: none;
    text-transform: uppercase;
    border-right: 1px solid #3030a0;
  }
  .nav-btn:last-child { border-right: none; }
  .nav-btn.active { background: #0000c0; color: #fff; border-top: 2px solid #8080ff; }
  .nav-btn:hover:not(.active) { background: #0000a0; color: #e0e0ff; }

  /* ── Header ── */
  #header {
    display: flex;
    align-items: center;
    gap: 15px;
    background: #000080;
    color: #fff;
    padding: 8px 12px;
    font-weight: bold;
    font-size: 18px;
    letter-spacing: 2px;
    flex-shrink: 0;
  }
  #header a {
    color: #adf;
    text-decoration: none;
    font-size: 15px;
    letter-spacing: 0;
  }
  #header .title { flex: 1; }

  .mode-badge {
    padding: 2px 15px;
    font-size: 15px;
    font-weight: bold;
    letter-spacing: 1px;
    border-top:    2px solid #808080;
    border-left:   2px solid #808080;
    border-right:  2px solid #fff;
    border-bottom: 2px solid #fff;
    background: #c0c0c0;
    color: #000;
  }
  .mode-manual  { background: #0000c0; color: #fff; }
  .mode-armed   { background: #c0c000; color: #000; }
  .mode-running { background: #00a000; color: #fff; }
  .mode-emergency { background: #c00000; color: #fff; }

  /* ── Status bar ── */
  #status-bar {
    padding: 5px 12px;
    background: #c0c0c0;
    border-bottom: 2px solid #808080;
    font-size: 15px;
    flex-shrink: 0;
  }
  #status-bar.ok   { color: #006000; }
  #status-bar.warn { color: #c00000; font-weight: bold; }

  /* ── Main area ── */
  #main {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  /* ── Compass grid ── */
  #compass {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    gap: 10px;
    width: min(90vw, 90vh, 450px);
    height: min(90vw, 90vh, 450px);
  }

  .btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 5px;
    background: #c0c0c0;
    border-top:    4px solid #fff;
    border-left:   4px solid #fff;
    border-right:  4px solid #404040;
    border-bottom: 4px solid #404040;
    cursor: pointer;
    font-family: Consolas, 'Courier New', Courier, monospace;
    font-size: 14px;
    font-weight: bold;
    letter-spacing: 0.6px;
    text-align: center;
    line-height: 1.2;
    touch-action: none;
    -webkit-tap-highlight-color: transparent;
    transition: background 0.05s;
  }

  .btn .arrow {
    font-size: 28px;
    line-height: 1;
  }

  .btn:active,
  .btn.pressed {
    background: #a0a0a0;
    border-top:    4px solid #404040;
    border-left:   4px solid #404040;
    border-right:  4px solid #fff;
    border-bottom: 4px solid #fff;
  }

  .btn.diag { background: #b8b8b0; }
  .btn.diag:active, .btn.diag.pressed { background: #909088; }

  .center-cell {
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 25px;
    opacity: 0.3;
  }

  /* Disabled state when not in manual */
  body.not-manual #compass { opacity: 0.35; pointer-events: none; }
  body.not-manual #status-bar { animation: blink 1s step-start infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  /* ── Active command display ── */
  #active-cmd {
    text-align: center;
    font-size: 15px;
    font-weight: bold;
    letter-spacing: 1px;
    padding: 5px 12px;
    background: #c0c0c0;
    border-top: 2px solid #808080;
    flex-shrink: 0;
    height: 35px;
  }

  #sensor-bar {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 20px;
    padding: 4px 12px;
    background: #b8b4ac;
    border-top: 1px solid #a0a0a0;
    flex-shrink: 0;
    font-size: 15px;
    font-weight: bold;
    letter-spacing: 0.6px;
  }
  .sen-field { display: flex; align-items: center; gap: 8px; }
  .sen-label { color: #606060; font-size: 12px; letter-spacing: 1px; text-transform: uppercase; }
  .sen-val {
    font-size: 18px;
    font-weight: bold;
    color: #000080;
    background: #fff;
    padding: 1px 10px;
    min-width: 65px;
    text-align: right;
    border-top: 2px solid #808080;
    border-left: 2px solid #808080;
    border-right: 2px solid #fff;
    border-bottom: 2px solid #fff;
  }
  .lamp-sm {
    width: 18px; height: 18px; border-radius: 50%;
    background: #888; border: 2px solid #606060;
  }
  .lamp-sm.on { background: radial-gradient(circle at 35% 35%, #80ff80, #00a000); border-color: #005000; box-shadow: 0 0 5px 1px #00cc0066; }
</style>
</head>
<body class="not-manual">

<div id="header">
  <span class="title">AGV MANUAL REMOTE</span>
  <span id="mode-badge" class="mode-badge">---</span>
</div>

<div id="status-bar" class="warn">Connecting...</div>

<div id="main">
  <div id="compass">
    <!-- Row 1 -->
    <button class="btn diag" data-cmd="fwd_left"  id="btn-fwd-left">
      <span class="arrow">&#8598;</span>FWD-L
    </button>
    <button class="btn" data-cmd="forward" id="btn-fwd">
      <span class="arrow">&#8593;</span>FORWARD
    </button>
    <button class="btn diag" data-cmd="fwd_right" id="btn-fwd-right">
      <span class="arrow">&#8599;</span>FWD-R
    </button>

    <!-- Row 2 -->
    <button class="btn" data-cmd="left" id="btn-left">
      <span class="arrow">&#8592;</span>LEFT
    </button>
    <div class="center-cell">&#9679;</div>
    <button class="btn" data-cmd="right" id="btn-right">
      <span class="arrow">&#8594;</span>RIGHT
    </button>

    <!-- Row 3 -->
    <button class="btn diag" data-cmd="rvs_left" id="btn-rvs-left">
      <span class="arrow">&#8601;</span>RVS-L
    </button>
    <button class="btn" data-cmd="reverse" id="btn-rvs">
      <span class="arrow">&#8595;</span>REVERSE
    </button>
    <button class="btn diag" data-cmd="rvs_right" id="btn-rvs-right">
      <span class="arrow">&#8600;</span>RVS-R
    </button>
  </div>
</div>

<div id="active-cmd"></div>

<div id="sensor-bar">
  <div class="sen-field">
    <span class="sen-label">Tape Pos</span>
    <span class="sen-val" id="m-pos">—</span>
    <span class="sen-label">mm</span>
  </div>
  <div class="sen-field">
    <span class="lamp-sm" id="m-tape"></span><span class="sen-label">TAPE</span>
  </div>
  <div class="sen-field">
    <span class="lamp-sm" id="m-lm"></span><span class="sen-label">L.MRK</span>
  </div>
  <div class="sen-field">
    <span class="lamp-sm" id="m-rm"></span><span class="sen-label">R.MRK</span>
  </div>
  <div class="sen-field">
    <span class="lamp-sm" id="m-fail"></span><span class="sen-label">FAIL</span>
  </div>
</div>

<script>
  const statusBar  = document.getElementById('status-bar');
  const modeBadge  = document.getElementById('mode-badge');
  const activeCmd  = document.getElementById('active-cmd');
  const body       = document.body;
  let   activeBtn  = null;
  let   lastMode   = null;

  // ── Send command to backend ───────────────────────────────────────────────
  // Heartbeat: resend active command every 100ms so backend watchdog never fires
  let _heartbeatTimer = null;
  let _activeCmd      = null;

  function _doPost(cmd) {
    fetch('/api/manual/command', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ command: cmd }),
      keepalive: true
    }).catch(() => {});
  }

  function sendCommand(cmd) {
    if (_heartbeatTimer) { clearInterval(_heartbeatTimer); _heartbeatTimer = null; }
    _activeCmd = cmd;
    _doPost(cmd);
    if (cmd !== null) {
      _heartbeatTimer = setInterval(() => _doPost(cmd), 100);
    }
  }

  // ── Button press / release ────────────────────────────────────────────────
  function onPress(btn) {
    if (activeBtn && activeBtn !== btn) onRelease(activeBtn);
    activeBtn = btn;
    btn.classList.add('pressed');
    const cmd = btn.dataset.cmd;
    activeCmd.textContent = '\u25ba ' + cmd.toUpperCase().replace('_', ' ') + ' [BTN]';
    sendCommand(cmd);
  }

  function onRelease(btn) {
    if (!btn) return;
    btn.classList.remove('pressed');
    activeBtn = null;
    activeCmd.textContent = '';
    sendCommand(null);
  }

  // ── Attach events to all buttons ──────────────────────────────────────────

  // Keyboard arrow keys (diagonal supported)
  const _keysDown  = new Set();
  const _arrowKeys = new Set(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight']);

  function _keyToCmd() {
    const up    = _keysDown.has('ArrowUp');
    const down  = _keysDown.has('ArrowDown');
    const left  = _keysDown.has('ArrowLeft');
    const right = _keysDown.has('ArrowRight');
    if (up   && left)  return 'fwd_left';
    if (up   && right) return 'fwd_right';
    if (down && left)  return 'rvs_left';
    if (down && right) return 'rvs_right';
    if (up)            return 'forward';
    if (down)          return 'reverse';
    if (left)          return 'left';
    if (right)         return 'right';
    return null;
  }

  function _updateKeyCmd() {
    if (activeBtn) return;   // button press takes priority
    const cmd = _keyToCmd();
    if (cmd === _activeCmd) return;
    activeCmd.textContent = cmd
      ? '\u25ba ' + cmd.toUpperCase().replace('_', ' ') + ' [KEY]'
      : '';
    sendCommand(cmd);
  }

  document.addEventListener('keydown', e => {
    if (!_arrowKeys.has(e.key)) return;
    e.preventDefault();
    if (_keysDown.has(e.key)) return;
    _keysDown.add(e.key);
    _updateKeyCmd();
  });

  document.addEventListener('keyup', e => {
    if (!_arrowKeys.has(e.key)) return;
    _keysDown.delete(e.key);
    _updateKeyCmd();
  });
  document.querySelectorAll('.btn[data-cmd]').forEach(btn => {
    // Mouse
    btn.addEventListener('mousedown',  e => { e.preventDefault(); onPress(btn); });
    btn.addEventListener('mouseup',    e => onRelease(btn));
    btn.addEventListener('mouseleave', e => { if (activeBtn === btn) onRelease(btn); });

    // Touch
    btn.addEventListener('touchstart',  e => { e.preventDefault(); onPress(btn); }, { passive: false });
    btn.addEventListener('touchend',    e => { e.preventDefault(); onRelease(btn); }, { passive: false });
    btn.addEventListener('touchcancel', e => { e.preventDefault(); onRelease(btn); }, { passive: false });
  });

  // Safety: if window loses focus, stop the AGV
  window.addEventListener('blur', () => { if (activeBtn) onRelease(activeBtn); });
  document.addEventListener('visibilitychange', () => {
    if (document.hidden && activeBtn) onRelease(activeBtn);
  });

  // ── State polling ─────────────────────────────────────────────────────────
  function applyMode(mode) {
    if (mode === lastMode) return;
    lastMode = mode;

    modeBadge.className = 'mode-badge';
    modeBadge.textContent = mode ? mode.toUpperCase() : '---';
    if (mode === 'manual')    modeBadge.classList.add('mode-manual');
    else if (mode === 'armed')    modeBadge.classList.add('mode-armed');
    else if (mode === 'running')  modeBadge.classList.add('mode-running');
    else if (mode === 'emergency') modeBadge.classList.add('mode-emergency');

    if (mode === 'manual') {
      body.classList.remove('not-manual');
      statusBar.className = 'ok';
      statusBar.textContent = 'MANUAL MODE — hold a button to move.';
    } else {
      body.classList.add('not-manual');
      if (activeBtn) onRelease(activeBtn);
      statusBar.className = 'warn';
      statusBar.textContent = mode
        ? 'Switch AGV to MANUAL mode to use this remote. Current: ' + mode.toUpperCase()
        : 'AGV not ready.';
    }
  }

  function setSenLamp(id, on) {
    const el = document.getElementById(id);
    if (el) el.className = 'lamp-sm' + (on ? ' on' : '');
  }

  async function poll() {
    try {
      const r = await fetch('/api/state');
      if (!r.ok) throw new Error(r.status);
      const d = await r.json();
      applyMode(d.agv.mode);
      const sen = d.sensor || {};
      document.getElementById('m-pos').textContent =
        (sen.left_mm != null) ? sen.left_mm : '—';
      setSenLamp('m-tape', sen.tape_detected);
      setSenLamp('m-lm',   sen.left_marker);
      setSenLamp('m-rm',   sen.right_marker);
      setSenLamp('m-fail', sen.sensor_failure);
    } catch(e) {
      statusBar.className = 'warn';
      statusBar.textContent = 'Connection lost — retrying...';
    }
  }

  poll();
  setInterval(poll, 500);
</script>

<nav id="nav-bar">
  <a class="nav-btn" href="/">HOME</a>
  <a class="nav-btn active" href="/manual">MANUAL</a>
  <a class="nav-btn" href="/io">IO</a>
  <a class="nav-btn" href="/trolley">TROLLEY</a>
  <a class="nav-btn" href="/params">PARAMS</a>
</nav>
</body>
</html>
