<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AGV — Parameters</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #d4d0c8;
    color: #000;
    font-family: Consolas, 'Courier New', Courier, monospace;
    font-size: 13px;
    padding: 8px;
    padding-bottom: 52px;
  }

  .raised {
    border-top:    2px solid #fff;
    border-left:   2px solid #fff;
    border-right:  2px solid #808080;
    border-bottom: 2px solid #808080;
  }

  #header {
    display: flex;
    align-items: center;
    gap: 12px;
    background: #000080;
    color: #fff;
    padding: 5px 10px;
    margin-bottom: 8px;
    font-weight: bold;
    font-size: 14px;
    letter-spacing: 2px;
  }
  #header .title { flex: 1; }
  #ts { font-size: 11px; color: #c0c0c0; }

  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }

  .section {
    background: #c0c0c0;
    padding: 0;
    margin-bottom: 0;
  }
  .section-title {
    background: #000080;
    color: #fff;
    font-weight: bold;
    font-size: 11px;
    letter-spacing: 2px;
    padding: 3px 8px;
    text-transform: uppercase;
  }

  table {
    width: 100%;
    border-collapse: collapse;
  }
  tr { border-bottom: 1px solid #b0b0b0; }
  tr:last-child { border-bottom: none; }
  tr:nth-child(even) { background: #b8b8b0; }

  td {
    padding: 3px 8px;
    font-size: 12px;
    vertical-align: middle;
  }
  td.param-name {
    color: #303060;
    font-weight: bold;
    width: 55%;
    letter-spacing: 0.3px;
  }
  td.param-val {
    color: #000080;
    font-weight: bold;
    text-align: right;
  }
  td.param-val.bool-true  { color: #006000; }
  td.param-val.bool-false { color: #a00000; }

  /* ── Nav bar ── */
  #nav-bar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    height: 44px;
    background: #1a1a6e;
    display: flex;
    z-index: 200;
    border-top: 2px solid #4040a0;
  }
  .nav-btn {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #a0a0e0;
    font-family: Consolas, 'Courier New', Courier, monospace;
    font-size: 11px;
    font-weight: bold;
    letter-spacing: 1px;
    text-decoration: none;
    text-transform: uppercase;
    border-right: 1px solid #3030a0;
  }
  .nav-btn:last-child { border-right: none; }
  .nav-btn.active { background: #0000c0; color: #fff; border-top: 2px solid #8080ff; }
  .nav-btn:hover:not(.active) { background: #0000a0; color: #e0e0ff; }
</style>
</head>
<body>

<div id="header" class="raised">
  <span class="title">PARAMETER LIST &nbsp;|&nbsp; AGV1-KIM</span>
  <span id="ts">—</span>
</div>

<div class="grid" id="params-grid"></div>

<nav id="nav-bar">
  <a class="nav-btn" href="/">HOME</a>
  <a class="nav-btn" href="/manual">MANUAL</a>
  <a class="nav-btn" href="/io">IO</a>
  <a class="nav-btn" href="/trolley">TROLLEY</a>
  <a class="nav-btn active" href="/params">PARAMS</a>
</nav>

<script>
function renderValue(v) {
  if (typeof v === 'boolean') {
    return `<td class="param-val ${v ? 'bool-true' : 'bool-false'}">${v ? 'YES' : 'NO'}</td>`;
  }
  return `<td class="param-val">${v}</td>`;
}

fetch('/api/params')
  .then(r => r.json())
  .then(data => {
    const grid = document.getElementById('params-grid');
    for (const [section, entries] of Object.entries(data)) {
      const div = document.createElement('div');
      div.className = 'section raised';
      let rows = '';
      for (const [key, val] of Object.entries(entries)) {
        rows += `<tr><td class="param-name">${key}</td>${renderValue(val)}</tr>`;
      }
      div.innerHTML =
        `<div class="section-title">${section}</div>` +
        `<table><tbody>${rows}</tbody></table>`;
      grid.appendChild(div);
    }
    document.getElementById('ts').textContent = new Date().toLocaleTimeString();
  })
  .catch(() => {
    document.getElementById('params-grid').textContent = 'Failed to load parameters.';
  });
</script>
</body>
</html>
