<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AGV — Parameters</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #d4d0c8;
    color: #000;
    font-family: Consolas, 'Courier New', Courier, monospace;
    font-size: 20px;
    padding: 15px;
    padding-bottom: 101px;
  }

  .raised {
    border-top:    2px solid #fff;
    border-left:   2px solid #fff;
    border-right:  2px solid #808080;
    border-bottom: 2px solid #808080;
  }

  #header {
    display: flex;
    align-items: center;
    gap: 24px;
    background: #000080;
    color: #fff;
    padding: 10px 19px;
    margin-bottom: 15px;
    font-weight: bold;
    font-size: 22px;
    letter-spacing: 2px;
  }
  #header .title { flex: 1; }
  #ts { font-size: 18px; color: #c0c0c0; }

  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
  }

  .section {
    background: #c0c0c0;
    padding: 0;
    margin-bottom: 0;
  }
  .section-title {
    background: #000080;
    color: #fff;
    font-weight: bold;
    font-size: 18px;
    letter-spacing: 2px;
    padding: 6px 15px;
    text-transform: uppercase;
  }

  table {
    width: 100%;
    border-collapse: collapse;
  }
  tr { border-bottom: 1px solid #b0b0b0; }
  tr:last-child { border-bottom: none; }
  tr:nth-child(even) { background: #b8b8b0; }

  td {
    padding: 6px 15px;
    font-size: 19px;
    vertical-align: middle;
  }
  td.param-name {
    color: #303060;
    font-weight: bold;
    width: 55%;
    letter-spacing: 0.6px;
  }
  td.param-val {
    color: #000080;
    font-weight: bold;
    text-align: right;
  }
  td.param-val.bool-true  { color: #006000; }
  td.param-val.bool-false { color: #a00000; }

  /* ── Controller settings (editable) ── */
  #settings-card { margin-bottom: 15px; }
  .setting-row {
    display: flex;
    align-items: center;
    padding: 12px 15px;
    border-bottom: 1px solid #b0b0b0;
  }
  .setting-row:last-of-type { border-bottom: none; }
  .setting-name {
    flex: 1;
    color: #303060;
    font-weight: bold;
    font-size: 19px;
    letter-spacing: 0.6px;
  }
  .toggle {
    position: relative;
    width: 116px; height: 38px;
    flex-shrink: 0;
    background: #a00000;
    cursor: pointer;
    font-family: inherit;
    font-weight: bold;
    font-size: 14px;
    letter-spacing: 1px;
    color: #fff;
    border-top:    2px solid #808080;
    border-left:   2px solid #808080;
    border-right:  2px solid #fff;
    border-bottom: 2px solid #fff;
    transition: background 0.1s;
  }
  .toggle.on { background: #006000; }
  .toggle::before {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    content: "OFF";
    right: 13px;
  }
  .toggle.on::before { content: "ON"; left: 15px; right: auto; }
  .toggle-knob {
    position: absolute;
    top: 2px; bottom: 2px;
    left: 2px;
    width: 46px;
    background: #c0c0c0;
    border-top:    2px solid #fff;
    border-left:   2px solid #fff;
    border-right:  2px solid #404040;
    border-bottom: 2px solid #404040;
    transition: left 0.1s;
  }
  .toggle.on .toggle-knob { left: calc(100% - 48px); }
  #settings-card.locked .toggle { opacity: 0.5; cursor: not-allowed; }
  .toggle.dep-disabled { opacity: 0.4; cursor: not-allowed; }
  .dep-note { font-weight: normal; font-size: 13px; color: #707070; letter-spacing: 0; }
  #settings-msg {
    padding: 8px 15px;
    font-size: 15px;
    letter-spacing: 0.5px;
    border-top: 1px solid #b0b0b0;
    min-height: 18px;
  }
  #settings-msg.info { color: #303060; }
  #settings-msg.warn { color: #a00000; font-weight: bold; }
  #settings-msg.ok   { color: #006000; font-weight: bold; }

  /* ── Nav bar ── */
  #nav-bar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    height: 86px;
    background: #1a1a6e;
    display: flex;
    z-index: 200;
    border-top: 2px solid #4040a0;
  }
  .nav-btn {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #a0a0e0;
    font-family: Consolas, 'Courier New', Courier, monospace;
    font-size: 26px;
    font-weight: bold;
    letter-spacing: 2px;
    text-decoration: none;
    text-transform: uppercase;
    border-right: 2px solid #3030a0;
  }
  .nav-btn:last-child { border-right: none; }
  .nav-btn.active { background: #0000c0; color: #fff; border-top: 2px solid #8080ff; }
  .nav-btn:hover:not(.active) { background: #0000a0; color: #e0e0ff; }
  .nav-btn.errors-btn { color: #ff8080; }
  .nav-btn.errors-btn.active { background: #800000; color: #fff; border-top: 2px solid #ff8080; }
</style>
</head>
<body>

<div id="header" class="raised">
  <span class="title">PARAMETER LIST</span>
  <span id="ts">—</span>
</div>

<div id="settings-card" class="section raised">
  <div class="section-title">CONTROLLER SETTINGS</div>
  <div class="setting-row">
    <span class="setting-name">RFID NAVIGATION <span class="dep-note">(corner speed zones)</span></span>
    <button class="toggle" id="toggle-NAV_ENABLED" data-flag="NAV_ENABLED">
      <span class="toggle-knob"></span>
    </button>
  </div>
  <div class="setting-row">
    <span class="setting-name">RFID SEQUENCE <span class="dep-note">(needs NAV)</span></span>
    <button class="toggle" id="toggle-SEQ_ENABLED" data-flag="SEQ_ENABLED">
      <span class="toggle-knob"></span>
    </button>
  </div>
  <div class="setting-row">
    <span class="setting-name">SLMP (PLC LINK) <span class="dep-note">(needs SEQ)</span></span>
    <button class="toggle" id="toggle-SLMP_ENABLED" data-flag="SLMP_ENABLED">
      <span class="toggle-knob"></span>
    </button>
  </div>
  <div id="settings-msg" class="info">—</div>
</div>

<div class="grid" id="params-grid"></div>

<nav id="nav-bar">
  <a class="nav-btn" href="/">HOME</a>
  <a class="nav-btn" href="/manual">MANUAL</a>
  <a class="nav-btn" href="/io">IO</a>
  <a class="nav-btn" href="/trolley">TROLLEY</a>
  <a class="nav-btn active" href="/params">PARAMS</a>
  <a class="nav-btn errors-btn" href="/errors">ERRORS</a>
</nav>

<script>
function renderValue(v) {
  if (typeof v === 'boolean') {
    return `<td class="param-val ${v ? 'bool-true' : 'bool-false'}">${v ? 'YES' : 'NO'}</td>`;
  }
  return `<td class="param-val">${v}</td>`;
}

fetch('/api/params')
  .then(r => r.json())
  .then(data => {
    const grid = document.getElementById('params-grid');
    for (const [section, entries] of Object.entries(data)) {
      const div = document.createElement('div');
      div.className = 'section raised';
      let rows = '';
      for (const [key, val] of Object.entries(entries)) {
        rows += `<tr><td class="param-name">${key}</td>${renderValue(val)}</tr>`;
      }
      div.innerHTML =
        `<div class="section-title">${section}</div>` +
        `<table><tbody>${rows}</tbody></table>`;
      grid.appendChild(div);
    }
    if (data['Features']) {
      setToggle('NAV_ENABLED',  data['Features']['RFID Navigation']);
      setToggle('SEQ_ENABLED',  data['Features']['RFID Sequence']);
      setToggle('SLMP_ENABLED', data['Features']['SLMP Enabled']);
      applyDeps();
    }
    document.getElementById('ts').textContent = new Date().toLocaleTimeString();
  })
  .catch(() => {
    document.getElementById('params-grid').textContent = 'Failed to load parameters.';
  });

// ── Editable controller settings ──────────────────────────────────────────
const _card = document.getElementById('settings-card');
const _msg  = document.getElementById('settings-msg');
let _locked = null;

function _setMsg(text, cls) { _msg.textContent = text; _msg.className = cls; }

function setToggle(flag, on) {
  const btn = document.getElementById('toggle-' + flag);
  if (btn) btn.classList.toggle('on', !!on);
}

function isOn(flag) {
  const btn = document.getElementById('toggle-' + flag);
  return btn && btn.classList.contains('on');
}

// Dependency hierarchy: NAV -> SEQ -> SLMP. A child can't be enabled while its
// parent is off, so grey out (and block) children whose parent is off.
function applyDeps() {
  const nav = isOn('NAV_ENABLED');
  const seq = isOn('SEQ_ENABLED');
  document.getElementById('toggle-SEQ_ENABLED').classList.toggle('dep-disabled', !nav);
  document.getElementById('toggle-SLMP_ENABLED').classList.toggle('dep-disabled', !(nav && seq));
}

function applyResponse(d) {
  setToggle('NAV_ENABLED',  d.NAV_ENABLED);
  setToggle('SEQ_ENABLED',  d.SEQ_ENABLED);
  setToggle('SLMP_ENABLED', d.SLMP_ENABLED);
  applyDeps();
}

['NAV_ENABLED', 'SEQ_ENABLED', 'SLMP_ENABLED'].forEach(flag => {
  document.getElementById('toggle-' + flag).addEventListener('click', () => {
    if (_card.classList.contains('locked')) return;
    const btn = document.getElementById('toggle-' + flag);
    if (btn.classList.contains('dep-disabled')) {
      _setMsg('Enable its parent feature first (NAV → SEQ → SLMP).', 'warn');
      return;
    }
    const newVal = !btn.classList.contains('on');
    _setMsg('Saving…', 'info');
    fetch('/api/params/features', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ [flag]: newVal })
    })
      .then(r => r.json().then(d => ({ ok: r.ok, d })))
      .then(({ ok, d }) => {
        if (!ok) { _setMsg(d.error || 'Failed to apply.', 'warn'); return; }
        applyResponse(d);
        _setMsg('Applied. Resets to profile default on restart.', 'ok');
      })
      .catch(() => _setMsg('Connection error — not saved.', 'warn'));
  });
});

function pollMode() {
  fetch('/api/state')
    .then(r => r.json())
    .then(d => {
      const mode     = d.agv && d.agv.mode;
      const isLocked = ['running', 'reverse', 'emergency'].includes(mode);
      if (isLocked !== _locked) {
        _locked = isLocked;
        _card.classList.toggle('locked', isLocked);
        if (isLocked)
          _setMsg('Locked — cannot change while AGV is ' + mode.toUpperCase() + '.', 'warn');
        else
          _setMsg('Changes apply immediately. Resets to profile default on restart.', 'info');
      }
    })
    .catch(() => {});
}
pollMode();
setInterval(pollMode, 1000);
</script>
</body>
</html>
